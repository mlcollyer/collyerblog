project:
  type: website
  output-dir: docs
website:
  description: "Blog of (R) fun (for the Collyer Lab of Evolutionary Morphometrics & Statistics)"
  site-url: https://www.michaelcollyer.com 
  title: "Blog of (R) fun "
  navbar:
    logo: images/evolmorph.png
    logo-href: index.html
    right:
      - about.qmd
      - icon: github
        href: https://github.com/mlcollyer
      - icon: bluesky
        href: https://bsky.app/profile/mlcollyer.bsky.social

format:
  html:
    theme:
      - flatly
      - brand
    css: styles.css

editor: visual

comments:
  giscus:
    repo: mlcollyer.github.io/collyerblog/
    repo-id: R_kgDO...
    category: Announcements
    category-id: DIC_kwDO...
    mapping: pathname
    reactions-enabled: true
    loading: lazy
